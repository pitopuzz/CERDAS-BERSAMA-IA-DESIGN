<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CERDAS BERSAMA</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header class="global-nav">
        <div class="nav-container container" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem;">
            <strong style="color: #2563eb; font-size: 1.2rem;">CERDAS BERSAMA</strong>
            <nav>
                <ul style="display: flex; gap: 1rem; list-style: none; margin: 0; padding: 0;">
                    <li><a href="dashboard.html" style="text-decoration: none; font-weight: bold; color: #0f172a;">Dashboard</a></li>
                    <li><a href="roadmap.html" style="text-decoration: none; color: #475569;">Roadmap</a></li>
                    <li><a href="portfolio.html" style="text-decoration: none; color: #475569;">Portfolio</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
        <h1 style="margin-bottom: 1.5rem;">Dashboard</h1>
        
        <section class="card" style="padding: 2rem; border-radius: 8px; border: 1px solid #e2e8f0; background: white;">
            <h2 id="welcome-message" style="margin-top: 0;">Loading...</h2>
            
            <div style="margin: 1.5rem 0;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: bold; color: #475569;">
                    <span>Course Progress</span>
                    <span id="progress-text">0% Completed</span>
                </div>
                <div class="progress-bar" style="width: 100%; height: 12px; background-color: #e2e8f0; border-radius: 6px; overflow: hidden;">
                    <div class="progress-fill" style="height: 100%; width: 0%; background-color: #10b981; transition: width 0.3s ease;"></div>
                </div>
            </div>

            <div style="margin-top: 2rem;">
                <a href="roadmap.html" id="resume-btn" class="btn" style="display: inline-block; padding: 0.75rem 1.5rem; background-color: #2563eb; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">Loading next step...</a>
            </div>
        </section>
    </main>
</body>
</html>
