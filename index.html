<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - CERDAS BERSAMA</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <main class="container splash-container" style="max-width: 600px; margin: 10vh auto; text-align: center; padding: 2rem;">
        <header style="margin-bottom: 2rem;">
            <h1 style="font-size: 2.5rem; color: #2563eb; margin-bottom: 0.5rem;">CERDAS BERSAMA</h1>
            <p style="font-size: 1.2rem; color: #475569;">Learn to build real AI products — from idea to launch.</p>
        </header>

        <section class="card" style="padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
            <form id="onboarding-form">
                <label for="user-name" style="display: block; font-weight: bold; margin-bottom: 1rem; color: #0f172a; text-align: left;">What is your name?</label>
                <input type="text" id="user-name" name="name" required placeholder="e.g. Alex" style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 4px; margin-bottom: 1.5rem; font-size: 1rem;">
                <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 1.1rem; cursor: pointer;">Start Learning</button>
            </form>
        </section>
    </main>
</body>
</html>
