<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Workspace - CERDAS BERSAMA</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header class="global-nav">
        <div class="nav-container container" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem;">
            <a href="roadmap.html" style="text-decoration: none; color: #475569; font-weight: bold;">&larr; Exit Workspace</a>
        </div>
    </header>

    <main class="container" style="max-width: 700px; margin: 2rem auto; padding: 0 1rem;">
        <div style="margin-bottom: 2rem;">
            <span style="font-size: 0.8rem; font-weight: bold; color: #2563eb; text-transform: uppercase; letter-spacing: 0.05em;">Project Workspace</span>
            <h1 id="project-title" style="margin-top: 0.5rem; margin-bottom: 0.5rem;">Loading Workspace...</h1>
            <p id="project-instructions" style="font-size: 1.1rem; color: #475569;"></p>
        </div>

        <section class="card" style="padding: 2rem; border-radius: 8px; border: 1px solid #e2e8f0; background: white;">
            <form id="project-form">
                <div id="form-fields-container">
                    </div>

                <div id="validation-msg" role="alert" style="display: none; padding: 1rem; background-color: #fee2e2; color: #991b1b; border-radius: 4px; margin-bottom: 1.5rem; font-weight: bold;"></div>
                
                <button type="submit" class="btn" style="width: 100%; padding: 1rem; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 1.1rem; cursor: pointer;">Save & Complete Project</button>
            </form>
        </section>
    </main>
</body>
</html>
